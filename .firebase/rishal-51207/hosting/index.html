<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Meta -->
  <meta name="description" content="Portfolio of Rishal - Flutter Developer & Mobile App Specialist creating exceptional digital experiences.">
  <meta name="keywords" content="Rishal, Portfolio, Flutter Developer, Mobile Apps, Cross-Platform Development, UI/UX Design, Firebase, Dart">
  <meta name="author" content="Rishal">
  <meta name="robots" content="index, follow">

  <!-- Open Graph Meta -->
  <meta property="og:title" content="Rishal | Flutter Developer Portfolio">
  <meta property="og:description" content="Passionate Flutter Developer crafting beautiful, high-performance mobile applications.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rishal-portfolio.web.app">
  <meta property="og:image" content="android-chrome-512x512.png">

  <!-- Twitter Card Meta -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Rishal | Flutter Developer Portfolio">
  <meta name="twitter:description" content="Passionate Flutter Developer crafting beautiful, high-performance mobile applications.">
  <meta name="twitter:image" content="android-chrome-512x512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rishal Portfolio">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Rishal | Flutter Developer Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Your Clean Color Theme */
      --bg-primary: #F8F9FA;
      --bg-surface: #FFFFFF;
      --text-primary: #1A1D21;
      --text-secondary: #6B7280;
      --accent: #4361EE;
      --accent-variant: #3A0CA3;
      --accent-light: #E6F0FF;
      --card-bg: #FFFFFF;
      --shadow: rgba(26, 29, 33, 0.04);
      --shadow-medium: rgba(26, 29, 33, 0.08);
      --shadow-heavy: rgba(26, 29, 33, 0.12);
      --gradient-start: #F8F9FA;
      --gradient-end: #E9ECEF;
      --border: #E5E7EB;
      --divider: #F3F4F6;
      --success: #10B981;
      --info: #3B82F6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
      overflow: hidden;
      height: 100vh;
      position: relative;
    }

    /* Modern Geometric Background */
    .bg-pattern {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .pattern-grid {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background-image: 
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.3;
      animation: gridMove 20s linear infinite;
    }

    .floating-shapes {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-variant) 100%);
      opacity: 0.05;
      animation: floatUp 15s infinite linear;
    }

    .shape:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-delay: 0s; }
    .shape:nth-child(2) { width: 120px; height: 120px; left: 80%; animation-delay: 2s; }
    .shape:nth-child(3) { width: 60px; height: 60px; left: 50%; animation-delay: 4s; }
    .shape:nth-child(4) { width: 100px; height: 100px; left: 25%; animation-delay: 6s; }
    .shape:nth-child(5) { width: 140px; height: 140px; left: 75%; animation-delay: 8s; }

    @keyframes gridMove {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(60px, 60px) rotate(0.5deg); }
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(0deg) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 0.05;
        transform: translateY(90vh) rotate(36deg) scale(1);
      }
      90% {
        opacity: 0.05;
        transform: translateY(-10vh) rotate(324deg) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-20vh) rotate(360deg) scale(0);
      }
    }

    /* Main Loader Container */
    .loader-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(20px);
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .loader-container.fade-exit {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    /* Modern Card Design */
    .content-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 
        0 32px 64px var(--shadow),
        0 16px 32px var(--shadow-medium),
        0 4px 16px var(--shadow-heavy);
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      max-width: 400px;
      width: 90%;
      animation: cardEntrance 1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .content-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(67, 97, 238, 0.05), transparent);
      animation: shimmer 2.5s infinite;
    }

    @keyframes cardEntrance {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    /* Brand Section */
    .brand-section {
      text-align: center;
      margin-bottom: 48px;
    }

    .brand-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-variant) 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      position: relative;
      animation: logoFloat 3s ease-in-out infinite;
      box-shadow: 
        0 16px 32px rgba(67, 97, 238, 0.25),
        0 8px 16px rgba(67, 97, 238, 0.15);
    }

    .brand-logo::after {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(135deg, var(--accent), var(--accent-variant));
      border-radius: 22px;
      z-index: -1;
      opacity: 0.2;
      filter: blur(8px);
    }

    .logo-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      font-weight: 600;
      color: white;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .brand-name {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards;
    }

    .brand-tagline {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0;
      animation: fadeInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s forwards;
    }

    @keyframes logoFloat {
      0%, 100% { 
        transform: translateY(0) rotate(0deg); 
        box-shadow: 0 16px 32px rgba(67, 97, 238, 0.25), 0 8px 16px rgba(67, 97, 238, 0.15);
      }
      50% { 
        transform: translateY(-8px) rotate(1deg);
        box-shadow: 0 24px 48px rgba(67, 97, 238, 0.3), 0 12px 24px rgba(67, 97, 238, 0.2);
      }
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Modern Loading Animation */
    .loading-section {
      text-align: center;
    }

    /* Particle System */
    .particles-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 60px;
      margin-bottom: 32px;
      position: relative;
    }

    .particle {
      width: 8px;
      height: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-variant));
      border-radius: 50%;
      position: absolute;
      animation: particleOrbit 2s ease-in-out infinite;
    }

    .particle:nth-child(1) { animation-delay: 0s; }
    .particle:nth-child(2) { animation-delay: 0.2s; }
    .particle:nth-child(3) { animation-delay: 0.4s; }
    .particle:nth-child(4) { animation-delay: 0.6s; }
    .particle:nth-child(5) { animation-delay: 0.8s; }
    .particle:nth-child(6) { animation-delay: 1s; }

    @keyframes particleOrbit {
      0% {
        transform: rotate(0deg) translateX(30px) scale(0.5);
        opacity: 0.3;
      }
      50% {
        transform: rotate(180deg) translateX(40px) scale(1);
        opacity: 1;
      }
      100% {
        transform: rotate(360deg) translateX(30px) scale(0.5);
        opacity: 0.3;
      }
    }

    /* Modern Progress Bar */
    .progress-container {
      width: 280px;
      height: 4px;
      background: var(--divider);
      border-radius: 2px;
      margin: 0 auto 24px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-variant) 100%);
      border-radius: 2px;
      width: 0%;
      position: relative;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      right: -20px;
      width: 20px;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6));
      animation: progressShine 1.5s ease-in-out infinite;
    }

    @keyframes progressShine {
      0% { transform: translateX(-100px); }
      100% { transform: translateX(300px); }
    }

    /* Text Elements */
    .loading-text {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 24px;
    }

    .loading-percentage {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 16px;
      opacity: 0.8;
    }

    .loading-subtitle {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-secondary);
      line-height: 1.5;
      max-width: 300px;
      margin: 0 auto;
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .content-card {
        padding: 32px 24px;
        border-radius: 20px;
        margin: 20px;
      }
      
      .brand-logo {
        width: 70px;
        height: 70px;
        border-radius: 18px;
      }
      
      .logo-text {
        font-size: 28px;
      }
      
      .brand-name {
        font-size: 24px;
      }
      
      .progress-container {
        width: 240px;
      }
      
      .loading-subtitle {
        max-width: 240px;
      }
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
      .particle,
      .brand-logo,
      .shape,
      .pattern-grid {
        animation: none;
      }
      
      .content-card {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <!-- Background Pattern -->
  <div class="bg-pattern">
    <div class="pattern-grid"></div>
    <div class="floating-shapes">
      <div class="shape"></div>
      <div class="shape"></div>
      <div class="shape"></div>
      <div class="shape"></div>
      <div class="shape"></div>
    </div>
  </div>

  <!-- Main Loader -->
  <div class="loader-container" id="loaderContainer">
    <div class="content-card">
      <!-- Brand Section -->
      <div class="brand-section">
        <div class="brand-logo">
          <div class="logo-text">R</div>
        </div>
        <div class="brand-name">Rishal</div>
        <div class="brand-tagline">Flutter Developer</div>
      </div>

      <!-- Loading Section -->
      <div class="loading-section">
        <!-- Particle Animation -->
        <div class="particles-container">
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Text Content -->
        <div class="loading-text" id="loadingText">Initializing Portfolio</div>
        <div class="loading-percentage" id="loadingPercentage">0%</div>
        <div class="loading-subtitle">Crafting exceptional mobile experiences with Flutter</div>
      </div>
    </div>
  </div>

  <!-- Flutter App Bootstrap -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    const loadingStates = [
      { text: 'Initializing Portfolio', duration: 800 },
      { text: 'Loading Flutter Framework', duration: 900 },
      { text: 'Preparing UI Components', duration: 700 },
      { text: 'Optimizing Performance', duration: 650 },
      { text: 'Finalizing Experience', duration: 550 },
      { text: 'Ready to Launch', duration: 400 }
    ];

    let currentState = 0;
    let progress = 0;

    const loadingText = document.getElementById('loadingText');
    const loadingPercentage = document.getElementById('loadingPercentage');
    const progressBar = document.getElementById('progressBar');
    const loaderContainer = document.getElementById('loaderContainer');

    function updateLoadingState() {
      if (currentState < loadingStates.length) {
        const state = loadingStates[currentState];
        
        // Smooth text transition
        loadingText.style.opacity = '0';
        loadingText.style.transform = 'translateY(10px)';
        
        setTimeout(() => {
          loadingText.textContent = state.text;
          loadingText.style.opacity = '1';
          loadingText.style.transform = 'translateY(0)';
        }, 150);

        currentState++;
        setTimeout(updateLoadingState, state.duration);
      }
    }

    function updateProgress() {
      const increment = Math.random() * 4 + 2;
      progress = Math.min(progress + increment, 100);
      
      const roundedProgress = Math.round(progress);
      loadingPercentage.textContent = `${roundedProgress}%`;
      progressBar.style.width = `${progress}%`;

      if (progress < 100) {
        setTimeout(updateProgress, 120 + Math.random() * 80);
      } else {
        // Complete loading
        setTimeout(() => {
          loadingText.textContent = 'Welcome!';
          setTimeout(hideLoader, 800);
        }, 300);
      }
    }

    function hideLoader() {
      loaderContainer.classList.add('fade-exit');
      setTimeout(() => {
        loaderContainer.style.display = 'none';
      }, 600);
    }

    // Start animations
    setTimeout(updateLoadingState, 600);
    setTimeout(updateProgress, 400);

    // Fallback loader hide
    window.addEventListener('load', function() {
      setTimeout(() => {
        if (loaderContainer && !loaderContainer.classList.contains('fade-exit')) {
          hideLoader();
        }
      }, 4500);
    });

    // Add smooth scroll behavior when loader is hidden
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(() => {
        document.body.style.overflow = 'auto';
      }, 5000);
    });
  </script>
</body>
</html>
